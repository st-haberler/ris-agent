[project]
name = "ris-preprocessor"
version = "0.1.0"
description = "Download and structure Austrian laws from the RIS OGD API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
ris-preprocessor = "ris_preprocessor.cli:main"
ris-agent = "ris_agent.cli:main"

[dependency-groups]
agent = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-ollama>=0.3",
    "pydantic>=2",
    "rich>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ris_preprocessor", "src/ris_agent"]
