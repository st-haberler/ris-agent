[project]
name = "ris-preprocessor"
version = "0.1.0"
description = "Download and structure Austrian laws from the RIS OGD API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
ris-preprocessor = "ris_preprocessor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ris_preprocessor"]
